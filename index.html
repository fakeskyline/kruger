<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%23FFFFFF%22>K</text></svg>">
    
    <meta name="description" content="Kruger — Developer. Building digital projects and experimenting with code.">
    <meta property="og:title" content="Kruger">
    <meta property="og:description" content="Kruger — Developer. Building digital projects and experimenting with code.">
    <meta property="og:image" content="./photo.png">
    <meta property="og:type" content="website">
    <title>Kruger</title>

    <!-- Иконки Bootstrap (сглаженные) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
</head>
<body>

    <div class="lang-switch" id="langSwitch">
        <button class="lang-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false">
            <span>[ LANG ]</span>
        </button>
        <div class="lang-menu" id="langMenu" role="listbox">
            <div class="lang-item active" data-value="en" role="option">EN</div>
            <div class="lang-item" data-value="uk" role="option">UK</div>
            <div class="lang-item" data-value="ru" role="option">RU</div>
        </div>
    </div>

    <main class="profile-content">
        
        <div class="header-section">
            <div class="avatar-wrapper">
                <img src="./photo.png" alt="Kruger" class="avatar-img" loading="eager" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="avatar-fallback">K</div>
            </div>

            <h1 class="nickname" data-i18n="nickname">Kruger</h1>
        </div>
        
        <p class="bio-text">
            <span id="bioText"></span><span class="cursor" aria-hidden="true"></span>
        </p>

        <div class="socials-container">
            <a href="https://t.me/krugeru" target="_blank" rel="noopener noreferrer" class="social-btn" title="Telegram">
                <i class="bi bi-telegram"></i>
            </a>
            <a href="https://github.com/fakeskyline" target="_blank" rel="noopener noreferrer" class="social-btn" title="GitHub">
                <i class="bi bi-github"></i>
            </a>
            <a href="https://www.tiktok.com/@whatskyline" target="_blank" rel="noopener noreferrer" class="social-btn" title="TikTok">
                <i class="bi bi-tiktok"></i>
            </a>
            <a href="mailto:zovnercukmaksim197@gmail.com" class="social-btn" title="Email">
                <i class="bi bi-envelope"></i>
            </a>
        </div>

        <div class="music-card">
            <div class="music-cover-wrapper">
                <img src="./cover.png" alt="Cover" class="music-cover" loading="eager" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="music-cover-fallback">
                    <i class="bi bi-file-earmark-x"></i>
                </div>
                <div class="music-badge">
                    <span data-i18n="last_track">FAVORITE TRACK</span>
                </div>
            </div>
            <div class="music-info">
                <div class="music-title">Пожалуйста, только не домой</div>
                <div class="music-author">Автоспорт</div>
            </div>
            <div class="music-actions">
                <a href="https://m.soundcloud.com/avtosportbrat/lficyypcuzsj" target="_blank" rel="noopener noreferrer" class="music-action-btn" title="SoundCloud">
                    <i class="bi bi-soundwave"></i>
                </a>
                <a href="https://m.soundcloud.com/avtosportbrat/lficyypcuzsj" target="_blank" rel="noopener noreferrer" class="music-action-btn" title="Open">
                    <i class="bi bi-box-arrow-up-right"></i>
                </a>
            </div>
            <div class="music-progress-area">
                <div class="music-progress-bar"><div class="music-progress-fill"></div></div>
                <div class="music-progress-labels"><span>#1</span> <span data-i18n="listened">LISTENED</span></div>
            </div>
            <div class="music-controls">
                <a href="https://m.soundcloud.com/avtosportbrat/lficyypcuzsj" target="_blank" rel="noopener noreferrer" class="music-skip" title="Previous">
                    <i class="bi bi-skip-start-fill"></i>
                </a>
                <a href="https://m.soundcloud.com/avtosportbrat/lficyypcuzsj" target="_blank" rel="noopener noreferrer" class="music-play" title="Play">
                    <i class="bi bi-play-fill"></i>
                </a>
                <a href="https://m.soundcloud.com/avtosportbrat/lficyypcuzsj" target="_blank" rel="noopener noreferrer" class="music-skip" title="Next">
                    <i class="bi bi-skip-end-fill"></i>
                </a>
            </div>
        </div>

        <div class="section-title" data-i18n="projects_title">> MY PROJECTS <</div>
        <div class="projects-grid">
            <div class="project-card">
                <div class="project-icon">
                    <img src="./icon.png" alt="Zeed Icon" loading="eager" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <span class="project-icon-fallback" style="display: none;">
                        <i class="bi bi-code-square"></i>
                    </span>
                </div>
                <div class="project-info">
                    <div class="project-header">
                        <div class="project-name" data-i18n="project1_name">Zeed</div>
                        <span class="project-badge" data-i18n="abandoned">ABANDONED</span>
                    </div>
                    <div class="project-desc" data-i18n="project1_desc">A lightweight and fast asynchronous framework for Telegram bots.</div>
                    <div class="project-links">
                        <a href="https://pypi.org/project/zeed/" target="_blank" rel="noopener noreferrer" class="project-link">[PyPI]</a>
                        <a href="https://github.com/fakeskyline/zeed" target="_blank" rel="noopener noreferrer" class="project-link">[GitHub]</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="section-title" data-i18n="stack_title">> MY TECH STACK <</div>
        <div class="tech-stack-container" id="techStackContainer">
            <span class="tech-tag">JavaScript</span>
            <span class="tech-tag">PHP</span>
            <span class="tech-tag">Python</span>
            <span class="tech-tag">Lua</span>
            <span class="tech-tag">Bash</span>
            <span class="tech-tag">HTML</span>
            <span class="tech-tag">CSS</span>
            <span class="tech-tag">Git</span>
            <span class="tech-tag">SQL</span>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
